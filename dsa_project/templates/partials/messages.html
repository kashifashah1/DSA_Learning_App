{# One place that draws all messages, so they look the same on every page. #}
{% if messages %}
  <div class="mb-4 space-y-2">
    {% for message in messages %}
      <div role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}"
           class="rounded-md border px-4 py-3 text-sm
             {% if message.level_tag == 'error' %}border-red-300 bg-red-50 text-red-800
             {% elif message.level_tag == 'success' %}border-green-300 bg-green-50 text-green-800
             {% elif message.level_tag == 'warning' %}border-amber-300 bg-amber-50 text-amber-800
             {% else %}border-sky-300 bg-sky-50 text-sky-800{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
