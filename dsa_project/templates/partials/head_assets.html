{% load static %}
{# Shared <head> assets for BOTH layouts (public_base.html and base.html). #}
{# The design system lives here (colours) and in static/css/design-system.css (components). #}

{# Tailwind CSS through the CDN: simplest way for development (needs internet). #}
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // Design system colours (UI master prompt).
          primary: "#172554",   // deep navy
          accent: "#2563EB",    // blue, used sparingly
          canvas: "#F8FAFC",    // page background
          ink: "#0F172A",       // main text
          muted: "#64748B",     // secondary text
          line: "#E2E8F0",      // borders
          success: "#15803D",
          warning: "#B45309",
          danger: "#B91C1C",
          // Older colours still used by the pages built before the redesign.
          // They are removed when those pages move to the design system.
          navy: "#0B1B3A",
          electric: "#38BDF8",
          violet: "#8B5CF6",
        },
        fontFamily: {
          sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
          mono: ["ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="{% static 'css/design-system.css' %}">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
