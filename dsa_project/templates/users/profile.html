{% extends "base.html" %}

{% block title %}Profile | DSA Path{% endblock %}

{% block content %}
  <h1 class="text-2xl font-semibold text-navy">Your profile</h1>
  <p class="mt-1 text-sm text-slate-600">Member since {{ request.user.date_joined|date:"j F Y" }}.</p>

  <form method="post" class="mt-6 max-w-sm rounded-md border border-slate-200 bg-white p-5" novalidate>
    {% csrf_token %}
    {% include "partials/form_errors.html" %}

    <label for="{{ form.name.id_for_label }}" class="block text-sm font-medium">Name</label>
    {{ form.name }}

    <label for="{{ form.email.id_for_label }}" class="mt-4 block text-sm font-medium">E-mail</label>
    {{ form.email }}

    <button type="submit"
            class="mt-6 rounded-md bg-navy px-4 py-2 text-sm font-medium text-white hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-electric">
      Save changes
    </button>
  </form>
{% endblock %}
